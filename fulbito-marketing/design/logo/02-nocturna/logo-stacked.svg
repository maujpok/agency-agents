<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 164 195" width="164" height="195" role="img" aria-label="Fulbito">
  <title>Fulbito — Logo apilado</title>
  <desc>Simbolo arriba, wordmark abajo, eje vertical compartido. Recorte al area viva, fondo transparente.</desc>
  <style type="text/css">
    <![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap');
      .wordmark {
        font-family: 'Archivo Black', 'Arial Black', 'Helvetica Neue', Impact, sans-serif;
        font-weight: 400;
        font-size: 46px;
        letter-spacing: -1.15px;
      }
    ]]>
  </style>
  <!-- ============================================================
       LOGO APILADO · NOCTURNA · FulbitoApp
       Para avatares de red social, merchandising, sellos y cualquier
       caja mas alta que ancha.
       Simbolo a escala 2,5 (grilla 64 -> 160). X = 20px.
         tinta del simbolo: 120 x 130px · x 22..142 · y 0..130
       Separacion interna = 1,5X = 30px, de la base del haz a la linea
       de ascendentes del wordmark. (El area de proteccion externa
       sigue siendo 2X = 40px; no esta incluida en el archivo.)
       Wordmark: Archivo Black 46px, tracking -1,15px (-25/1000 em),
       linea de base y = 193,35. Anclado por tinta (x = -2,32 compensa
       el lsb real de la "F") y no por caja de avance: el centrado
       optico no depende de como cada motor aplique el tracking.
       Proporcion: wordmark 161,8px = 1,35 x el ancho del simbolo.
       El simbolo manda; la palabra lo apoya.
       ============================================================ -->
  <g transform="translate(2,-15) scale(2.5)">
    <path d="M20 6 L44 6 L47 14 L17 14 Z" fill="#F5A623"/>
    <path d="M23 18 L32.5 18 L27.5 58 L8 58 Z" fill="#1DB954"/>
    <path d="M36.5 18 L41 18 L56 58 L31.5 58 Z" fill="#1DB954"/>
  </g>
  <text class="wordmark" x="-2.32" y="193.35" fill="#F5F5F5">Fulbito</text>
</svg>
