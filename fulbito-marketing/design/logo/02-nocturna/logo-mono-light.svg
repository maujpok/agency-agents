<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 306 65" width="306" height="65" role="img" aria-label="Fulbito">
  <title>Fulbito — Logo monocromo claro</title>
  <desc>Una sola tinta #F5F5F5 para fondos oscuros y sobre fotografia con scrim.</desc>
  <style type="text/css">
    <![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap');
      .wordmark {
        font-family: 'Archivo Black', 'Arial Black', 'Helvetica Neue', Impact, sans-serif;
        font-weight: 400;
        font-size: 64px;
        letter-spacing: -1.6px;
      }
    ]]>
  </style>
  <!-- ============================================================
       MONO CLARO · una tinta #F5F5F5 · para fondos oscuros
       #F5F5F5 y no #FFFFFF: el blanco puro sobre negro puro produce
       halo. Es la misma regla que ya usa el UI kit para el texto.
       Sobre fotografia exige scrim negro de 60% como minimo.
       ============================================================ -->
  <g transform="translate(-10,-7.5) scale(1.25)" fill="#F5F5F5">
    <path d="M20 6 L44 6 L47 14 L17 14 Z"/>
    <path d="M23 18 L32.5 18 L27.5 58 L8 58 Z"/>
    <path d="M36.5 18 L41 18 L56 58 L31.5 58 Z"/>
  </g>
  <text class="wordmark" x="75.3" y="55.3" fill="#F5F5F5">Fulbito</text>
</svg>
