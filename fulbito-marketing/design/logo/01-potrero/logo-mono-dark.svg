<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img" aria-labelledby="pt-title pt-desc">
  <title id="pt-title">Fulbito — monotinta oscura POTRERO</title>
  <desc id="pt-desc">Corte a una sola tinta birome (#1F1B16), para fondos claros. La raya de cal pasa a ser calado transparente de 7,2 u entre las dos mitades del disco; la estructura es identica a la del corte a color.</desc>
