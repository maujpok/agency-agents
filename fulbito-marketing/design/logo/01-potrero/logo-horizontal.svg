<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="500" height="160" role="img" aria-labelledby="pt-title pt-desc">
  <title id="pt-title">Fulbito — lockup horizontal POTRERO</title>
  <desc id="pt-desc">Isotipo La Raya: disco escarbado, la pelada de tierra abajo a la izquierda, el pasto arriba a la derecha y la raya de cal de 6,6 u marcando el limite entre las dos. Wordmark Fulbito en una sola linea a la derecha del isotipo. Sin tag APP.</desc>
  <defs>
